<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask for a Reason to Say No - Just for Fun</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="heading">
        Ask for a Reason to Say No - Just for Fun
    </h1>

    <div class="container">
        <div class="card">
            <div class="reasonText" id="reasonText">
                The last time I said yes, it rained for 40 days. Not doing that again.
            </div>
            <div class="btn-container">
                <div class="btn btn-copy" id="copyBtn">Copy this!</div>
                <div class="btn btn-new" id="newBtn">New Reason</div>
            </div>
        </div>
    </div>

    <div class="attribution">
     Credits:
        This project is powered by <a href="https://github.com/hotheadhacker/no-as-a-service"
            target="_blank">no-as-a-service</a> API
    </div>
    <script src="script.js"></script>
</body>

</html>
